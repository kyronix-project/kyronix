name: test
on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 podman autoconf automake
      
      - name: Build test ISO
        run: make test-iso -j $(nproc) CRUNTIME=podman
      
      - name: Run tests in QEMU
        run: |
          timeout 2m make test-run-log 2>&1 | tee test.log
          cat test.log
