name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Verify version matches tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          kv=$(sed -n 's/ *#define *KERNEL_VERSION *"\(.*\)"/\1/p' kernel/version.h)
          if [ "${TAG#v}" != "$kv" ]; then
            echo "error: tag '$TAG' does not match KERNEL_VERSION '$kv'" >&2
            exit 1
          fi

      - name: Build RELEASE image
        run: make live CRUNTIME=podman RELEASE=1

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyronix-release-isos
          path: dist/*.iso
          if-no-files-found: error

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyronix-release-checksums
          path: dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/*-live.iso
            dist/*-live.iso.sha256
          generate_release_notes: true
