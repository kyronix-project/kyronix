[core]
backend=fbdev-backend.so
shell=desktop-shell.so
require-input=true
idle-time=0

[shell]
background-color=0xff1a1a2e
panel-position=top
locking=false
animation=zoom
startup-animation=fade
client=/usr/libexec/weston-desktop-shell
cursor-theme=default
cursor-size=60

[terminal]
font=DejaVu Sans Mono
font-size=14
term=linux

[keyboard]
keymap_layout=us

[libinput]
enable-tap=true
